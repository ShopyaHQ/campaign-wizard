# WORKFLOW STATE SCHEMA
# Defines the shape of a campaign run's state file, the legal state machine, and the
# machine-checkable prerequisites for every transition.
#
# This file is a SCHEMA and a DECLARATIVE TRANSITION TABLE. It contains no executable code.
# The validator (a later, separate change) reads this file; it does not re-implement it.
#
# GOVERNING PRINCIPLE
# The model is never the authority on whether a stage is complete. A transition is legal only
# when its prerequisites evaluate true against artifacts on disk and recorded owner decisions.
# An expected closing sentence is not evidence. See refusals.closing_sentence_is_not_proof.

schema:
  name: workflow_state
  version: 1.8.0   # 1.8.0: STRUCTURED FRONT HALF. Four first-class, canonically-hashed objects
                   # (research_brief, research_ledger, campaign_directions, and one campaign_spec
                   # with immutable revisions) become the front-half AUTHORITY, mapped onto the
                   # EXISTING states (no second state machine — owner ruling 2026-08-12). Typed
                   # hash-bound approvals gate kickoff, direction, premise, vertical, architecture
                   # and the final "build this" campaign_spec. Version-gated exactly like run_mode:
                   # fresh vNext runs (pinned spec >= 1.8.0) MUST carry the structured objects and
                   # hash-bound approvals; historical runs (< 1.8.0) stay readable under the old
                   # prose-artifact predicates (frame/stage1/stage2/stage4/stage5 …). Request v2
                   # for a vNext run binds spec_ref to the exact approved campaign_spec
                   # id/revision/hash; the proven back half is otherwise untouched.
                   # 1.7.0: run-level run_mode (production|diagnostic), immutable, minted at NEW.
                   # Fresh vNext runs require it; historical runs stay readable under their pin
                   # (Model B current-canon: a pre-1.7.0 run migrates before it can transition).
  charter_min_version: 0.2.0
  vnext_structured_front_half_min: 1.8.0   # spec floor at/above which the structured-object gates
                                           # and hash-bound approvals are ENFORCED (below it, the
                                           # legacy prose predicates apply — historical readability).
  state_file_path: "campaigns/<run_id>/state.yaml"
  notes: >
    Claim ids in `charter_ref` fields point at SHOPYA_CAMPAIGN_CHARTER.yaml. A prerequisite
    with a charter_ref is traceable to an approved decision; one without is a schema-local
    structural check.
  changelog:
    1.8.0: >
      Structured Wizard Front Half (owner ruling 2026-08-12). Four first-class structured objects
      replace prose as the front-half AUTHORITY, mapped onto the EXISTING states with no new state
      machine: research_brief (FRAME_READY), research_ledger (SIGNALS_READY), campaign_directions
      (OPPORTUNITIES_READY) + the exact direction selection (OPPORTUNITY_SELECTED), and ONE
      campaign_spec carried as immutable revisions whose premise+vertical sections gate
      BRIEF_APPROVED, whose collection_selections+rails+content_program composite gates
      ROUTE_SELECTED, whose naming_voice+default_composition+seam_intent complete at
      ACTIVATION_READY, and whose EXACT final composite hash ("build this") gates SEAM6_READY.
      New predicates: structured_artifact_current, campaign_spec_section_hashes_present,
      campaign_spec_revision_immutable, approval_binds_object_hash, approval_binds_spec_sections,
      final_spec_approval_binds_composite, direction_selection_binds_direction,
      no_stale_approval_after_dependency_change. Approvals are typed and hash-bound: an approval of
      one object/section/revision can never authorize a different one (a materially changed object
      produces a new hash, and the stale approval no longer gates). All new gates are version-gated
      at spec >= 1.8.0; a historical (< 1.8.0) run is judged under the pre-1.8.0 prose predicates
      and is never forced to carry the structured objects. Request v2 for a vNext run binds spec_ref
      to the exact approved campaign_spec; the back half (fulfillment, receipt, execution package,
      manifest, approval) is unchanged.
    1.6.0: >
      Post-regression corrections (owner directive 2026-08-10, defects demonstrated by the
      Almost Fall r002 regression). A1: new reopen edge CAMPAIGN_APPROVED -> SEAM6_READY
      (reopen_execution_post_approval) so a run approved on stale execution can regenerate it
      through the sanctioned interface; the reopen atomically invalidates campaign_approved,
      stamps validation_attempts/verification invalid and supersedes products_csv +
      execution_manifest. An invalidated owner decision no longer satisfies
      owner_decision_recorded until re-recorded. A2: canon migration (run.py migrate) may not
      leave traversed hash-bound proof that fails the current canon — non-compliant passing
      validation_attempts are stamped invalidated, seam6_execution_status is downgraded from
      'validated', and the stale execution artifacts are superseded (refusal
      stale_execution_proof enforces status/proof coherence). Binding predicates now refuse a
      superseded products_csv. A4: the ACTIVATION_READY explore-feed gate no longer enforces
      the superseded global <=4 cap (owner ruling phase1_matrix_approved_rulings_r1_r5,
      2026-08-07: the global four-feed model is INVALID for the locked Phase-1 product, which
      requires >=3 product rails per required vertical); every activation must still DECLARE
      explore_feeds — the declaration requirement survives, the obsolete cap does not. No
      replacement numeric maximum is invented; practical per-surface maximums arrive from
      frontend evidence (charter explore_002 revision, 0.5.0).
    1.5.0: >
      Owner ruling 2026-08-09 (Ruling 2 — governance_003). owner_decisions entries carry a
      BINARY status enum (provisional_recommendation | owner_confirmed). owner_decision_recorded
      requires status owner_confirmed; decided:true and decided_by:product_owner are valid ONLY
      on owner_confirmed (refusal decision_status_misstamped). Engine fulfillment, validator
      passes and material exceptions are NOT owner decisions and live in their own structures —
      never in owner_decisions. (An interim draft briefly added fulfilled/validated/exception to
      this enum; the hardening pass removed them.) Under Model B (governance_001) a run pinned to
      an older canon must migrate (run.py migrate) before it can transition.

# ═══════════════════════════════════════════════════════════════════
# 1 · STATE FILE SHAPE
# ═══════════════════════════════════════════════════════════════════

state_file:

  run:
    run_id:
      type: string
      pattern: "^cmp_[0-9A-HJKMNP-TV-Z]{26}$"
      minted_at_state: NEW
      immutable: true
      charter_ref: identity_002
    spec_version:
      type: string
      pinned_at_state: NEW
      immutable_until_state: REVIEWED
      charter_ref: governance_001
    charter_version:
      type: string
      pinned_at_state: NEW
      immutable_until_state: REVIEWED
      migration_required_to_change: true
      charter_ref: governance_001
    run_mode:
      type: enum
      values: [production, diagnostic]
      minted_at_state: NEW
      immutable: true
      desc: >
        Run-level authority identity, set once at NEW and IMMUTABLE for the life of the run.
        production = a normal fulfilment-bound run; diagnostic = a sanctioned below-Foundation
        diagnostic run whose artifacts can never satisfy production gates. A Curation Request
        inherits this mode and may never self-declare greater authority. Migration does NOT
        change it. It is not in settable_paths, so run.py set cannot mutate it.
    created_at: {type: timestamp}

  identity:
    charter_ref: identity_001
    campaign_id:
      value:
        type: string
        nullable: true
        pattern: "^[a-z0-9]+(-[a-z0-9]+)*-[0-9]{4}$"
        derivation: "durable occasion, territory or subject + year"
        must_not_derive_from: [creative_route, display_name]
        charter_ref: identity_003
      status:
        type: enum
        values: [null, proposed, confirmed, rejected, retired]
        charter_ref: identity_004
      confirmed_by_owner: {type: boolean, default: false}
      externally_referenced: {type: boolean, default: false}
      first_external_reference:
        nullable: true
        fields: {system: string, artifact: string, timestamp: timestamp}
        charter_ref: identity_005
      earliest_proposable_state: OPPORTUNITY_SELECTED
      immutable_from: "identity.campaign_id.externally_referenced == true"
    display_name:
      type: string
      nullable: true
      created_at_state: [ROUTES_READY, ROUTE_SELECTED]
      mutable: true
      is_join_key: false
      charter_ref: identity_007

  workflow:
    state: {type: enum, values_from: states}
    entered_at: {type: timestamp}
    history:
      type: list
      item: {from: string, to: string, at: timestamp, decision_ref: string, prerequisites_evaluated: list}

  owner_decisions:
    type: map
    description: >
      Ledger of OWNER JUDGMENTS ONLY. The key is the decision id named by a transition's
      owner_decision_recorded predicate. A transition requiring an owner gate CANNOT proceed on
      conversational inference NOR on an agent recommendation — only on a genuinely explicit
      owner confirmation (status owner_confirmed).
      Status vocabulary is BINARY (charter governance_003, owner ruling 2026-08-09):
        provisional_recommendation  agent proposal, owner approval pending
        owner_confirmed             genuinely explicit owner confirmation (the ONLY status that
                                    gates a transition, and the ONLY status on which
                                    decided_by may be product_owner)
      Engine FULFILLMENT lives in product truth / current_truth.jsonl; VALIDATION lives in
      validation_attempts; material EXCEPTIONS are reported in their own artifacts. None of
      those are owner decisions and none belong in this ledger.
    item:
      status: {type: enum, values: [provisional_recommendation, owner_confirmed]}
      decided: {type: boolean, description: "true only when status == owner_confirmed"}
      decided_by: {type: string, description: "product_owner permitted ONLY when status == owner_confirmed"}
      decided_at: {type: timestamp}
      value: {type: any, description: "the selection, e.g. an opportunity_id or route_id"}
      note: {type: string, optional: true}

  artifacts:
    type: map
    description: "artifact key -> record. Presence is checked on disk, never asserted."
    item:
      path: {type: string}
      written_at: {type: timestamp}
      sha256: {type: string}
      status:
        type: enum
        values: [current, superseded]
        default: current
      superseded_by: {type: string, nullable: true}
      superseded_at: {type: timestamp, nullable: true}
      supersession_reason: {type: string, nullable: true}
    rules:
      - "Artifacts are NEVER deleted. A reopen marks them superseded and preserves them."
      - "A prerequisite referencing an artifact resolves only against status: current.
         A superseded artifact can never satisfy a gate."

  validation_attempts:
    description: >
      Validation is an ATTEMPTED ACTION inside SEAM6_READY, not a state transition. A failed
      build does not move the run. VALIDATED means validation passed.
    type: list
    item:
      attempted_at: {type: timestamp}
      result: {type: enum, values: [passed, failed]}
      failures: {type: list, item: {predicate: string, path: string, detail: string}}
      report_path: {type: string, optional: true}
      invalidated_at: {type: timestamp, nullable: true}
      invalidated_by_decision: {type: string, nullable: true}
      package_validated: {type: boolean, optional: true,
                          desc: "true only when validate-package validated the COMPLETE A–G
                                 package and bound the immutable execution manifest. A
                                 products.csv-only validate-execution attempt does NOT set this."}
      package_manifest_sha256: {type: string, optional: true,
                                desc: "sha256 of the execution_manifest this package validation is
                                       bound to — must equal the registered execution_manifest
                                       artifact sha256 for VALIDATED (execution_package_validated)."}

  abandonment:
    charter_ref: identity_005
    nullable: true
    description: "Written on entry to ABANDONED. Classification is computed, never supplied."
    run_id_status: {type: enum, values: [retained], const: retained}
    campaign_id_status:
      type: enum
      values: [never_minted, released, retired]
      derivation:
        - "identity.campaign_id.value is null            -> never_minted"
        - "value set AND externally_referenced == false  -> released  (returns to the pool)"
        - "externally_referenced == true                 -> retired   (never reused)"
    abandoned_at: {type: timestamp}
    decision_ref: {type: string, const: abandon_run}

  execution_tracking:
    charter_ref: scope_002
    description: "Authoring, execution and handoff are tracked SEPARATELY. The wizard must never
                  imply a handoff artifact was implemented."
    activation_architecture_status:
      type: enum
      values: [not_started, drafted, approved]
    seam6_execution_status:
      type: enum
      values: [not_started, ready, validated, executed]
    external_handoffs_status:
      type: enum
      values: [not_started, authored]
    external_handoffs_implemented:
      type: enum
      values: [unknown, partial, complete]
      default: unknown
      note: "Never inferred. Only set from an explicit owner report."

  collection_freeze:
    charter_ref: constraint_repo_005
    frozen_from_state: LIVE
    snapshot:
      type: list
      item: {collection_id: string, frozen_at: timestamp, sha256: string}
    exceptions:
      type: list
      item:
        required_fields: [reason, approved_by, approved_at, affected_collection_id, change_summary]

  capability_claims:
    description: >
      Capabilities a run asserts. Each must be permitted by a passed pending_validation in the
      pinned charter, or the run is refused. Prevents a run from claiming verified behavior the
      charter records as pending.
    type: list
    item: {capability: string, asserted_at_state: string}

  verification:
    description: >
      The COMPUTED live-verification record. Written ONLY by `run.py verify-live` (not settable),
      which binds the result to the executed build. LIVE consumes it; an agent cannot enter LIVE
      by asserting post_cache_verified=true. When the sandbox cannot reach the live product, a
      human-observed result may be ingested — but method + observed_by make that provenance
      explicit; there is no generic boolean set-path.
    fields:
      post_cache_verified: {type: boolean, desc: "the observed live result (pass)"}
      reprobe_at:          {type: timestamp, desc: "post-cache verification time (~10min after activation)"}
      executed_build:      {type: string, desc: "the build id that was imported/executed"}
      build_sha256:        {type: string, desc: "sha256 of the products_csv that was executed — must match the registered artifact"}
      rail_ids:            {type: list, desc: "expected rail/feed identifiers checked live"}
      method:              {type: enum, values: [automated_probe, human_observation]}
      observed_by:         {type: string, desc: "who/what observed (required for human_observation)"}
      evidence:            {type: string, desc: "probe output ref / screenshot ref / hash of evidence"}
      result:              {type: enum, values: [pass, fail]}

  execution_tracking_executed_build:
    note: "execution_tracking.executed_build: the build id recorded as imported. Set by verify-live."

  # ─────────────────────────────────────────────────────────────────
  # STRUCTURED FRONT-HALF OBJECTS (spec 1.8.0) — canonical, hashed, immutable-by-revision.
  # These are AUTHORITY (owner ruling 2026-08-12), not co-equal with the old prose artifacts.
  # Each is a registered artifact (register-object) whose canonical hash the validator recomputes;
  # the state file carries the id/revision/hash spine so approvals can bind an EXACT object.
  # ─────────────────────────────────────────────────────────────────

  structured_objects:
    description: >
      The vNext front-half spine. Each entry mirrors an artifact registered under artifacts.* and
      records the object's stable id, current revision, and canonical_hash (recomputed by the
      validator from the artifact bytes). A hash-bound approval names {id, revision, hash}; if the
      object materially changes it gets a new revision + hash, and any approval bound to the old
      hash no longer gates (no_stale_approval_after_dependency_change / approval_binds_object_hash).
      Written ONLY by run.py register-object; not in settable_paths.
    type: map
    keys: [research_brief, research_ledger, campaign_directions, campaign_spec]
    item:
      object_kind: {type: enum, values: [research_brief, research_ledger, campaign_directions, campaign_spec]}
      object_id: {type: string, desc: "stable logical id, e.g. rb_… / rl_… / cd_… / cs_…"}
      revision: {type: string, desc: "immutable revision label, e.g. r001; a material change mints a new one"}
      parent_revision: {type: string, nullable: true}
      canonical_hash: {type: string, desc: "sha256 over the object's canonical (semantic-normalized) bytes"}
      section_hashes:
        type: map
        nullable: true
        desc: "campaign_spec only: per-section canonical hash (premise, vertical_strategies,
               collection_selections, rails, content_program, naming_voice, default_composition,
               seam_intent). Lets a section approval bind exactly one section."
      artifact_key: {type: string, desc: "the artifacts.* key holding the object bytes on disk"}
      created_at: {type: timestamp}
      supersedes_revision: {type: string, nullable: true}
    rules:
      - "A revision is IMMUTABLE. run.py register-object writes a NEW revision file; it never edits
         an existing one (campaign_spec_revision_immutable)."
      - "canonical_hash is recomputed by the validator from the artifact bytes; a state-file hash
         that disagrees with the bytes is a refusal (structured_object_hash_mismatch)."
      - "A material change to a dependency section invalidates a downstream approval per the
         declared dependency graph (dependency_graph); the validator refuses a stale approval."

  # Declared front-half section dependency graph (task §19). A material change to an upstream
  # object/section makes every downstream approval stale. Independent leaves (e.g. a content
  # headline) do NOT invalidate unrelated upstream approvals. The validator reads THIS, not agent
  # discretion (no_stale_approval_after_dependency_change).
  dependency_graph:
    research_brief:            {depends_on: []}
    research_ledger:           {depends_on: [research_brief]}
    campaign_directions:       {depends_on: [research_ledger]}
    selected_direction:        {depends_on: [campaign_directions]}
    campaign_spec.premise:             {depends_on: [selected_direction]}
    campaign_spec.vertical_strategies: {depends_on: [campaign_spec.premise]}
    campaign_spec.collection_selections: {depends_on: [campaign_spec.premise, campaign_spec.vertical_strategies]}
    campaign_spec.rails:                 {depends_on: [campaign_spec.collection_selections]}
    campaign_spec.content_program:       {depends_on: [campaign_spec.collection_selections]}
    campaign_spec.naming_voice:          {depends_on: [campaign_spec.premise]}
    campaign_spec.default_composition:   {depends_on: [campaign_spec.rails, campaign_spec.content_program]}
    campaign_spec.seam_intent:           {depends_on: [campaign_spec.collection_selections, campaign_spec.rails, campaign_spec.content_program]}
    campaign_spec.composite:             {depends_on: [campaign_spec.premise, campaign_spec.vertical_strategies,
                                                       campaign_spec.collection_selections, campaign_spec.rails,
                                                       campaign_spec.content_program, campaign_spec.naming_voice,
                                                       campaign_spec.default_composition, campaign_spec.seam_intent]}

  # The typed hash-bound approval ledger extension (task §4/§8/§11/§20/§21). Each front-half owner
  # approval is a normal owner_decisions entry (status owner_confirmed) whose VALUE binds the exact
  # object it approves. The validator recomputes the bound hash from disk and refuses a mismatch.
  front_half_approvals:
    description: "owner_decisions ids reserved for the five front-half checkpoints + direction selection."
    kickoff_approved:
      binds: {object: research_brief, fields: [object_id, revision, canonical_hash]}
      checkpoint: "KICKOFF REVIEW (task §4)"
    direction_selected_v2:
      binds: {object: campaign_directions, fields: [object_id, revision, direction_id, direction_hash]}
      checkpoint: "RESEARCH + DIRECTION REVIEW (task §8)"
    premise_approved:
      binds: {object: campaign_spec, fields: [object_id, revision, section, section_hash]}
      section_const: premise
      checkpoint: "PREMISE + VERTICAL REVIEW — premise (task §11)"
    verticals_approved:
      binds: {object: campaign_spec, fields: [object_id, revision, section, section_hash]}
      section_const: vertical_strategies
      checkpoint: "PREMISE + VERTICAL REVIEW — verticals (task §11)"
    architecture_approved:
      binds: {object: campaign_spec, fields: [object_id, revision, composite_of, composite_hash]}
      composite_of_const: [collection_selections, rails, content_program]
      checkpoint: "CAMPAIGN ARCHITECTURE REVIEW (task §20)"
    campaign_spec_approved:
      binds: {object: campaign_spec, fields: [object_id, revision, composite_hash]}
      meaning: "build this exact campaign architecture (task §21)"
      checkpoint: "FINAL CAMPAIGN SPEC (task §21)"

# ═══════════════════════════════════════════════════════════════════
# 2 · PREDICATE VOCABULARY
# The validator implements exactly these. No others may appear in prerequisites.
# ═══════════════════════════════════════════════════════════════════

predicates:
  charter_approved:        {args: [], desc: "pinned charter has status: approved"}
  versions_pinned:         {args: [], desc: "run.spec_version and run.charter_version are non-null"}
  versions_unchanged:      {args: [], desc: "pinned versions match those recorded at NEW"}
  version_not_withdrawn:   {args: [], desc: "neither pinned version appears in a withdrawn registry"}
  artifact_exists:         {args: [key], desc: "artifacts[key].path exists on disk and hash matches"}
  field_present:           {args: [dotted_path]}
  field_non_empty:         {args: [dotted_path]}
  field_equals:            {args: [dotted_path, value]}
  field_in:                {args: [dotted_path, values]}
  count_between:           {args: [dotted_path, min, max]}
  count_max:               {args: [dotted_path, n],
                            desc: "COUNTS resolved items. Does not look inside them."}
  sum_max:                 {args: [dotted_path, n],
                            desc: "SUMS the numeric values at the path. A missing or non-numeric
                                   value is a FAILURE, never silently skipped — a cap that
                                   quietly ignores undeclared values is not a cap."}
  each_has_keys:           {args: [dotted_path, required_fields],
                            desc: "every item CONTAINS all keys. A null value PASSES. Use where the
                                   gate tests provenance structure rather than substantive content,
                                   and the stage schema declares fields nullable."}
  each_has_non_null:       {args: [dotted_path, required_fields],
                            desc: "every item carries all fields AND none is null/empty."}
  each_has:                {args: [dotted_path, required_fields],
                            deprecated: true,
                            desc: "DEPRECATED alias of each_has_non_null. Retained so an older
                                   pinned spec still resolves. Do not use in new prerequisites."}
  each_satisfies:          {args: [dotted_path, predicate], desc: "single level of nesting only"}
  owner_decision_recorded: {args: [decision_id], desc: "owner_decisions[id].status == owner_confirmed
                                                        AND decided == true with decided_by and decided_at.
                                                        A provisional_recommendation, fulfilled, validated
                                                        or exception entry does NOT satisfy this gate."}
  pending_validation_passed: {args: [validation_id], desc: "charter pending_validations[id] recorded as passed"}
  capability_permitted:    {args: [capability], desc: "no unpassed pending_validation blocks it"}
  campaign_id_unique:      {args: [], desc: "no other active or externally-referenced run owns this occasion-year id"}
  last_validation_passed:  {args: [], desc: "validation_attempts is non-empty, its last entry has
                                             result: passed, and that entry is not invalidated"}
  validation_binds_products_csv: {args: [], desc: "the last passing validation_attempt's
                                             output_sha256 equals the registered products_csv
                                             artifact sha256 — the pass is bound to THAT built
                                             file, so a hand-authored CSV cannot satisfy VALIDATED"}
  verification_bound_to_executed_build: {args: [], desc: "verification.result == pass, its
                                             build_sha256 equals the registered products_csv
                                             sha256, executed_build matches, and (for
                                             human_observation) observed_by is present — so LIVE
                                             cannot be entered by asserting a boolean"}
  artifact_current:        {args: [key], desc: "artifacts[key].status == current"}
  execution_package_validated: {args: [], desc: "the last passing validation_attempt validated the
                                             COMPLETE A–G package (not merely products.csv): its
                                             package_manifest_sha256 equals the CURRENT registered
                                             execution_manifest artifact sha256, package_validated
                                             is true, and every component the attempt recorded is
                                             hashed. A products.csv-only attempt (no
                                             package_manifest_sha256) can NEVER satisfy this — so
                                             VALIDATED requires the whole package, not just the CSV."}
  execution_package_approval_binds_manifest: {args: [decision_id], desc: "the owner
                                             execution-package approval decision binds the EXACT
                                             current execution_manifest: decision.value.manifest_id
                                             and manifest_sha256 both equal the registered
                                             execution_manifest artifact (id in the manifest file,
                                             sha256 in the artifact record). An approval recorded
                                             against an older manifest can never authorize a new
                                             package; being in VALIDATED is not approval."}

  # ── STRUCTURED FRONT-HALF predicates (spec 1.8.0). All are version-gated: on a run pinned
  # below vnext_structured_front_half_min they PASS trivially (historical readability), so the
  # legacy prose prerequisites alone govern a pre-1.8.0 run. ──
  structured_object_present: {args: [object_kind], desc: "structured_objects[object_kind] exists,
                             its artifact is registered + current, and the state-file canonical_hash
                             equals the hash recomputed from the artifact bytes on disk (no
                             hand-edited hash). Version-gated (>= 1.8.0)."}
  campaign_spec_sections_present: {args: [sections], desc: "the current campaign_spec revision carries
                             a non-empty section_hash for every named section. Version-gated."}
  campaign_spec_revision_immutable: {args: [], desc: "no two campaign_spec revisions share an id+revision
                             with differing canonical_hash — a revision is write-once. Version-gated."}
  approval_binds_object_hash: {args: [decision_id, object_kind], desc: "the owner approval decision
                             binds decision.value.{object_id, revision, canonical_hash} equal to the
                             CURRENT structured_objects[object_kind] spine; an approval bound to a
                             superseded revision/hash cannot gate. Version-gated."}
  approval_binds_spec_section: {args: [decision_id, section], desc: "the owner approval decision binds
                             decision.value.{object_id, revision, section, section_hash} equal to the
                             CURRENT campaign_spec revision's section_hashes[section]; a materially
                             changed section gets a new hash and the stale approval no longer gates
                             (dependency invalidation is deterministic). Version-gated."}
  approval_binds_spec_composite: {args: [decision_id, sections], desc: "the owner approval decision
                             binds decision.value.composite_hash equal to the canonical hash of the
                             named sections of the CURRENT campaign_spec revision (order-stable). Used
                             for the architecture composite and the final build-this composite.
                             Version-gated."}
  direction_selection_binds_direction: {args: [decision_id], desc: "the owner direction-selection
                             decision binds decision.value.{direction_id, direction_hash} to a
                             direction that EXISTS in the current campaign_directions object with a
                             matching per-direction canonical hash; a changed direction set makes the
                             stale selection non-gating. Version-gated."}
  front_half_approval_not_stale: {args: [decision_id], desc: "the front-half approval is not listed in
                             state.invalidated (a dependency change or reopen invalidates it until the
                             owner re-records it on the current object). Version-gated."}

# ═══════════════════════════════════════════════════════════════════
# 3 · STATES
# ═══════════════════════════════════════════════════════════════════

states:

  - name: NEW
    stage: 0
    entry_prerequisites:
      - {p: versions_pinned}
      - {p: charter_approved, charter_ref: governance_001}
      - {p: version_not_withdrawn}
      - {p: field_present, args: [run.run_id]}
    produces: []

  - name: FRAME_READY
    stage: 0
    structured_object: research_brief   # vNext (1.8.0): the research_brief IS the frame authority.
    entry_prerequisites:
      # vNext (>=1.8.0): the structured research_brief is the authority (task §3). Version-gated —
      # PASSES on a historical run, which is judged by the legacy frame.* prose gates below.
      - {p: structured_object_present, args: [research_brief]}
      # Legacy prose frame (pre-1.8.0 runs; a vNext run's derived review rendering may still carry it).
      - {p: artifact_exists, args: [frame]}
      - {p: field_non_empty, args: [frame.objective]}
      - {p: field_non_empty, args: [frame.planning_horizon]}
      - {p: field_non_empty, args: [frame.market]}
      - {p: field_non_empty, args: [frame.eligible_seams]}
      - {p: field_present, args: [frame.hard_constraints]}
      - {p: field_present, args: [frame.known_unknowns]}
    produces: ["campaigns/<run_id>/frame.yaml", "campaigns/<run_id>/research_brief.r<NNN>.yaml"]
    forbids: [product_library_access]
    notes: >
      vNext (1.8.0): research_brief carries owner_supplied vs system_inferred vs derived provenance
      per material field (task §3). The KICKOFF REVIEW checkpoint approves it (kickoff_approved,
      hash-bound). The legacy frame.yaml is a derived review rendering / historical compatibility,
      never co-equal authority.

  - name: RESEARCHING
    stage: 1
    entry_prerequisites:
      # vNext KICKOFF REVIEW (task §4): typed, hash-bound approval of the EXACT research_brief.
      - {p: approval_binds_object_hash, args: [kickoff_approved, research_brief]}
      - {p: front_half_approval_not_stale, args: [kickoff_approved]}
      # frame_accepted remains the owner-confirmation gate (kickoff_approved IS frame_accepted for
      # vNext; the legacy id is kept for pre-1.8.0 runs and back-compat).
      - {p: owner_decision_recorded, args: [frame_accepted]}
    produces: []
    notes: "vNext: kickoff_approved binds research_brief id+revision+hash (task §4). Material brief
            change → new revision/hash → the prior kickoff approval no longer gates (stale)."

  - name: SIGNALS_READY
    stage: 1
    structured_object: research_ledger   # vNext (1.8.0): structured evidence, not prose notes (task §5).
    entry_prerequisites:
      # vNext: the research_ledger is the structured evidence authority (task §5/§6). Version-gated.
      - {p: structured_object_present, args: [research_ledger]}
      # Legacy prose signals (pre-1.8.0; vNext derived review rendering may still carry them).
      - {p: artifact_exists, args: [stage1_signals]}
      - {p: artifact_exists, args: [stage1_landscape]}
      - {p: each_has_keys, args: [signals, [signal_id, claim, evidence_type, source, source_date,
                                            observed_date, direct_observation, interpretation,
                                            confidence, limitations]],
         rationale: "This gate tests PROVENANCE STRUCTURE, not substantive content. The Stage 1
                     schema declares source_date nullable (undated sources) and interpretation
                     nullable (a source that was not retrieved may not carry a reading). Null
                     passes; an absent key does not."}
      - {p: field_present, args: [stage1.evidence_families_covered]}
      - {p: field_present, args: [stage1.stop_condition_met]}
      - {p: field_present, args: [stage1.deviations]}
    produces: ["campaigns/<run_id>/stage1_signals.yaml", "campaigns/<run_id>/stage1_landscape.md"]
    forbids: [campaign_names, taglines, rails, collections, product_library_access]

  - name: OPPORTUNITIES_READY
    stage: 2
    structured_object: campaign_directions   # vNext (1.8.0): directions with stable IDs (task §7).
    entry_prerequisites:
      # vNext: campaign_directions is the authority — 2–4 genuinely distinct directions derived
      # from the research_ledger, each with a stable id + per-direction hash (task §7). Version-gated.
      - {p: structured_object_present, args: [campaign_directions]}
      # Legacy prose opportunities (pre-1.8.0; vNext derived review rendering may still carry them).
      - {p: artifact_exists, args: [stage2_opportunities]}
      - {p: artifact_exists, args: [stage2_comparison]}
      - {p: count_between, args: [opportunities, 4, 6]}
      - {p: each_has_non_null, args: [opportunities, [opportunity_id, territory, observation,
                                             cultural_tension, audience_behavior, why_now,
                                             shopya_role, desired_user_action,
                                             instrumentation_mapping, supporting_signal_ids,
                                             relevant_seams, surface_potential, ownability,
                                             expiration, confidence, assumptions,
                                             operational_risks]]}
      - {p: each_has_non_null, args: [opportunities.ownability, [level, rationale]], charter_ref: ownability_001}
      - {p: capability_permitted, args: [claiming_L3_by_evidence], charter_ref: ownability_003}
    produces: ["campaigns/<run_id>/stage2_opportunities.yaml", "campaigns/<run_id>/stage2_comparison.md"]
    forbids: [campaign_names, taglines, rails, collections, asset_copy]

  - name: OPPORTUNITY_SELECTED
    stage: 2
    entry_prerequisites:
      # vNext RESEARCH + DIRECTION REVIEW (task §8): the owner selects an EXACT direction; the
      # decision binds the direction_id + per-direction hash from the current campaign_directions.
      - {p: direction_selection_binds_direction, args: [direction_selected_v2]}
      - {p: front_half_approval_not_stale, args: [direction_selected_v2]}
      # Legacy owner-confirmation gate (kept for pre-1.8.0 runs; direction_selected_v2 is the vNext
      # form of opportunity_selected).
      - {p: owner_decision_recorded, args: [opportunity_selected]}
      - {p: field_present, args: [identity.campaign_id.status]}
    permits: [campaign_id_proposal]
    charter_ref: identity_004
    notes: "vNext: changing the selected direction (or the direction set) invalidates downstream
            premise/architecture/spec approvals per the dependency_graph (task §8/§19)."

  - name: INTERVIEW_COMPLETE
    stage: 3
    vnext_prose_passthrough: true   # vNext (1.8.0): kept ONLY as an internal/compat transition (owner
                                    # ruling 2026-08-12). No new structured object; on a vNext run the
                                    # legacy interview prose prereqs are optional (the structured
                                    # objects already carry this material). Pre-1.8.0 runs keep them.
    entry_prerequisites:
      - {p: artifact_exists, args: [stage3_interview]}
      - {p: field_non_empty, args: [interview.desired_behavior]}
      - {p: field_non_empty, args: [interview.delivery_intent]}
      - {p: field_equals, args: [interview.avoid_terms_confirmed, true], charter_ref: behavior_rule_002}
      - {p: field_present, args: [interview.avoid_terms]}
      - {p: field_present, args: [interview.success_condition]}
      - {p: field_present, args: [interview.execution_constraints]}
      - {p: field_present, args: [interview.raw_user_responses]}
      - {p: field_present, args: [interview.normalized]}
    produces: ["campaigns/<run_id>/stage3_interview.yaml"]
    notes: "avoid_terms MAY be []; avoid_terms_confirmed MUST be true. An empty confirmed list
            is valid — do not force an invented prohibition."

  - name: BRIEF_DRAFT
    stage: 4
    vnext_prose_passthrough: true   # vNext (1.8.0): the campaign_spec premise/vertical workshop IS the
                                    # brief-draft phase; the legacy stage4_brief artifact is a derived
                                    # rendering, optional on a vNext run. The revision-round self-loop
                                    # is preserved. Pre-1.8.0 runs keep the prose prereq.
    entry_prerequisites:
      - {p: artifact_exists, args: [stage4_brief]}
    self_loop: true
    self_loop_note: "Revision rounds are unbounded and require no decision to re-enter."
    notes: >
      U1 (demonstrated 2026-08-07, cmp_01KZCD765E6NNW2TZR1AFHQMWG): the workshop decomposes into
      NAMED owner decisions - premise lock, architecture rulings, sourcing approvals - each
      recorded via record-decision with its basis at the moment the owner rules. brief_approved
      consolidates them; it is not the only decision. Trivial wording tweaks need no decision.
      U2 (demonstrated, same run): after the premise lock, direction-specific research EXTENDS
      stage1_signals (append + re-register + artifact re-validation), scoped to testing
      collection roles and premise assumptions - never a re-run of the broad scan. A premise
      change is a reopen, not an append.

  - name: BRIEF_APPROVED
    stage: 4
    structured_object: campaign_spec   # vNext (1.8.0): PREMISE + VERTICAL REVIEW (task §9–§11).
    entry_prerequisites:
      # vNext PREMISE + VERTICAL REVIEW (task §11): ONE composed review, two distinct typed
      # approvals — premise and vertical_strategies — each hash-bound to the exact campaign_spec
      # section. Version-gated (PASSES on a pre-1.8.0 run, which uses the legacy brief gates).
      - {p: structured_object_present, args: [campaign_spec]}
      - {p: campaign_spec_sections_present, args: [[premise, vertical_strategies]]}
      - {p: approval_binds_spec_section, args: [premise_approved, premise]}
      - {p: front_half_approval_not_stale, args: [premise_approved]}
      - {p: approval_binds_spec_section, args: [verticals_approved, vertical_strategies]}
      - {p: front_half_approval_not_stale, args: [verticals_approved]}
      # Legacy prose brief (pre-1.8.0; vNext derived review rendering may still carry it).
      - {p: owner_decision_recorded, args: [brief_approved]}
      - {p: each_has_non_null, args: [brief.tests, [truth, behavior, mechanism, surface, ownability,
                                           theme, feasibility, competitor]]}
      - {p: field_non_empty, args: [brief.desired_behavior]}
      - {p: field_non_empty, args: [brief.participation_mechanism]}
      - {p: field_non_empty, args: [brief.measurement]}
      - {p: each_has_non_null, args: [brief.ownability, [level, rationale]]}
    produces: ["campaigns/<run_id>/stage4_brief.yaml", "campaigns/<run_id>/campaign_spec.r<NNN>.yaml"]
    notes: >
      vNext: premise_approved and verticals_approved are DISTINCT typed decisions binding distinct
      section hashes (task §11). Verticals may have unequal conviction and a vertical may hold zero
      durable collections — there is NO per-vertical quota or symmetry gate (Content Charter CB-1..
      CB-5; task §10). A premise change mints a new campaign_spec revision and invalidates both
      section approvals (dependency_graph); an independent content-headline change does not touch
      the premise approval (task §19).

  - name: ROUTES_READY
    stage: 5
    vnext_prose_passthrough: true   # vNext (1.8.0): the campaign_spec architecture (collection_
                                    # selections/rails/content_program) IS the routes work; the
                                    # composite architecture approval is taken at ROUTE_SELECTED. The
                                    # legacy stage5_routes artifact is a derived rendering, optional on
                                    # a vNext run. Pre-1.8.0 runs keep the prose prereqs.
    entry_prerequisites:
      - {p: artifact_exists, args: [stage5_routes]}
      - {p: count_between, args: [routes, 2, 3]}
      - {p: each_has_non_null, args: [routes, [route_id, strategic_expression, user_mechanism,
                                      shopya_mechanism, tone, visual_logic, surface_expression,
                                      advantages, risks, name_candidates]]}
    produces: ["campaigns/<run_id>/stage5_routes.yaml"]

  - name: ROUTE_SELECTED
    stage: 5
    structured_object: campaign_spec   # vNext (1.8.0): CAMPAIGN ARCHITECTURE REVIEW (task §12–§20).
    entry_prerequisites:
      # vNext CAMPAIGN ARCHITECTURE REVIEW (task §20): ONE composed review of the whole program —
      # collection_selections + rails + content_program — approved by a single composite-hash-bound
      # decision. NO product-row approval. Version-gated.
      - {p: campaign_spec_sections_present, args: [[collection_selections, rails, content_program]]}
      - {p: approval_binds_spec_composite, args: [architecture_approved, [collection_selections, rails, content_program]]}
      - {p: front_half_approval_not_stale, args: [architecture_approved]}
      # Legacy owner-confirmation + identity gates (route_selected is the pre-1.8.0 form).
      - {p: owner_decision_recorded, args: [route_selected]}
      - {p: field_equals, args: [identity.campaign_id.confirmed_by_owner, true], charter_ref: identity_004}
      - {p: field_equals, args: [identity.campaign_id.status, confirmed]}
      - {p: campaign_id_unique, charter_ref: identity_006}
      - {p: field_non_empty, args: [identity.display_name]}
    notes: >
      vNext: architecture_approved binds ONE composite hash over collection_selections + rails +
      content_program of the current campaign_spec revision (task §20) — the owner reviews the
      composed campaign, not individual rails/rows. A material change to any of those three sections
      re-mints the composite hash and the stale architecture approval no longer gates.

  - name: ACTIVATION_READY
    stage: 6
    structured_object: campaign_spec   # vNext (1.8.0): naming_voice + default_composition + seam_intent complete.
    vnext_additive_only: true          # ADD the structured section gates; keep ALL real activation gates.
    entry_prerequisites:
      # vNext (task §15–§17): the campaign_spec's naming_voice, default_composition and seam_intent
      # sections are complete before Seam 6 readiness. Version-gated.
      - {p: campaign_spec_sections_present, args: [[naming_voice, default_composition, seam_intent]]}
      # Legacy prose activation (pre-1.8.0; vNext derived review rendering may still carry it).
      - {p: artifact_exists, args: [stage6_activation]}
      - {p: each_has_non_null, args: [activations, [seam_id, surface, role, user_action, execution_mode,
                                           owner, activation_authority, scheduling, artifact,
                                           implementation_status]], charter_ref: scope_002}
      - {p: each_has_non_null, args: [activations.scheduling, [semantic_status, evaluation_mode,
                                                      cache_latency_seconds, precision]],
         charter_ref: scheduling_003}
      - {p: field_present, args: [delivery.intent.mode], charter_ref: scheduling_006}
      - {p: sum_max, args: [activations.explore_feeds, null], charter_ref: explore_002,
         rationale: "Every activation must DECLARE a NUMERIC explore_feeds, including 0 for
                     handoff seams; an undeclared or non-numeric value fails. The cap is null:
                     the former global ceiling of 4 was superseded by owner ruling
                     phase1_matrix_approved_rulings_r1_r5 (2026-08-07 — the locked Phase-1
                     product requires >=3 product rails per required vertical), and no
                     replacement numeric maximum is invented; practical per-surface maximums
                     come from frontend evidence (charter explore_002, 0.5.0)."}
      - {p: capability_permitted, args: [claiming_s6_window_scheduling_verified], charter_ref: scheduling_005}
      - {p: capability_permitted, args: [claiming_rail_links_to_collection_page], charter_ref: view_all_001}
      - {p: field_equals, args: [execution_tracking.activation_architecture_status, approved]}
    produces: ["campaigns/<run_id>/stage6_activation.yaml", "campaigns/<run_id>/handoffs/"]
    notes: "go_live.expected_visibility {earliest, latest} and cache_assumptions are required
            when delivery.intent.mode != evergreen."

  - name: SEAM6_READY
    stage: 7
    structured_object: campaign_spec   # vNext (1.8.0): FINAL CAMPAIGN SPEC "build this" (task §21–§23).
    vnext_additive_only: true          # ADD the final "build this" gate; keep ALL real seam6 gates.
    entry_prerequisites:
      # vNext FINAL CAMPAIGN SPEC (task §21): the owner approves the EXACT final campaign_spec
      # revision — "build this exact campaign architecture" — bound to the composite hash over ALL
      # eight sections. This is the final pre-fulfillment authority; Request v2 for a vNext run may
      # only be generated from this exact approved spec (task §22/§23). Version-gated.
      - {p: campaign_spec_sections_present, args: [[premise, vertical_strategies, collection_selections,
                                                    rails, content_program, naming_voice,
                                                    default_composition, seam_intent]]}
      - {p: campaign_spec_revision_immutable}
      - {p: approval_binds_spec_composite, args: [campaign_spec_approved, [premise, vertical_strategies,
                                                  collection_selections, rails, content_program,
                                                  naming_voice, default_composition, seam_intent]]}
      - {p: front_half_approval_not_stale, args: [campaign_spec_approved]}
      # Legacy prose seam6 (pre-1.8.0; vNext derived review rendering may still carry it).
      - {p: artifact_exists, args: [stage7_seam6]}
      - {p: each_has_non_null, args: [rails, [rail_id, collection_id, rail_position]], charter_ref: rail_001}
      - {p: each_satisfies, args: [rails, has_rail_position], charter_ref: rail_001}
      - {p: each_satisfies, args: [rails, exactly_one_collection], charter_ref: rail_001}
      - {p: each_satisfies, args: [entities, meets_technical_minimum], charter_ref: render_001}
      - {p: each_satisfies, args: [entities, meets_quality_minimum_or_has_exception], charter_ref: render_002}
      - {p: field_in, args: [collections.sub_group, [fashion, home_interior, tech, beauty,
                                                     travel, wellness_health]], charter_ref: surface_006}
      - {p: capability_permitted, args: [claiming_persisted_collection_item_order], charter_ref: rail_004}
      - {p: field_equals, args: [execution_tracking.seam6_execution_status, ready]}
    produces: ["campaigns/<run_id>/stage7_seam6.yaml", "campaigns/<run_id>/execution/"]
    permits: [product_library_access, run_validation]
    notes: >
      First state in which the product library may be read. Validation is ATTEMPTED here and
      may fail any number of times; a failed attempt appends to validation_attempts and the run
      REMAINS in SEAM6_READY. There is no failure transition.
      vNext: campaign_spec_approved is the exact "build this" authority — it binds the composite of
      all eight sections of the current revision; only this current, non-stale approval may authorize
      deterministic Request v2 generation for production (task §22/§23). Being architecture-approved
      is not "build this"; the final approval is a distinct typed decision.

  - name: VALIDATED
    stage: 8
    meaning: "Validation PASSED for the COMPLETE A–G package. A failed build never reaches this
              state, and a products.csv-only pass is no longer sufficient."
    entry_prerequisites:
      - {p: artifact_exists, args: [products_csv]}
      - {p: artifact_exists, args: [execution_manifest]}
      - {p: last_validation_passed}
      - {p: validation_binds_products_csv}
      - {p: execution_package_validated}
      - {p: field_equals, args: [execution_tracking.seam6_execution_status, validated]}
      - {p: field_present, args: [validation_attempts]}
    notes: "Validation now validates the COMPLETE package (A Master CSV, B Collection Creation
            Spec, C Rail/Feed Spec, D Content Package, E Seam Handoffs, G Human Checklist) and
            binds the immutable F Execution Manifest. Warnings do not block: deprecated
            collection_rank, non-blocking pending validations, limited inventory resilience,
            cache-bounded activation imprecision, unsupported non-essential handoff capabilities."

  - name: CAMPAIGN_APPROVED
    stage: 8
    entry_prerequisites:
      - {p: owner_decision_recorded, args: [execution_package_approved]}
      - {p: execution_package_approval_binds_manifest, args: [execution_package_approved]}
      - {p: artifact_exists, args: [execution_manifest]}
      - {p: execution_package_validated}
      - {p: field_equals, args: [execution_tracking.external_handoffs_status, authored]}
    notes: >
      CAMPAIGN_APPROVED now requires an EXPLICIT execution-package approval bound to the EXACT
      current Execution Manifest id + sha256 (execution_package_approved decision.value). Being in
      VALIDATED is not approval; an approval recorded against a superseded/older manifest cannot
      authorize the current package (task §23/§24). This is the prd.md §19 execution-package
      approval: "approve this exact validated human execution package for implementation."

  - name: LIVE
    stage: 8
    entry_prerequisites:
      - {p: field_present, args: [verification.reprobe_at]}
      - {p: field_equals, args: [verification.post_cache_verified, true]}
      - {p: verification_bound_to_executed_build}
      - {p: field_non_empty, args: [collection_freeze.snapshot]}
      - {p: field_equals, args: [execution_tracking.seam6_execution_status, executed]}
    on_entry:
      - "freeze every externally referenced campaign collection (charter constraint_repo_005)"
      - "record first_external_reference if not already set (charter identity_005)"
    charter_ref: constraint_repo_005

  - name: REVIEWED
    stage: 9
    entry_prerequisites:
      - {p: artifact_exists, args: [stage9_measurement]}
      - {p: artifact_exists, args: [review]}
      - {p: each_has_non_null, args: [measurement, [desired_behavior, instrumentation_status, event,
                                           retrieval_status, evaluation_owner, baseline_available,
                                           attribution_window, success_condition,
                                           measurement_limitations]], charter_ref: measurement_006}
      - {p: field_present, args: [review.observed_results]}
      - {p: field_present, args: [review.lessons]}
    produces: ["campaigns/<run_id>/stage9_measurement.yaml", "campaigns/<run_id>/review.yaml"]
    terminal: true
    unpins_versions: true

  - name: ABANDONED
    stage: null
    terminal: true
    status: proposed_addition
    rationale: >
      Charter identity_005 states that an abandoned run releases the slug and that abandoned
      externally-referenced ids remain retired. Neither rule is representable without a terminal
      abandoned state. Included so the identity rules are enforceable; flagged for owner ruling.
    status: approved
    entry_prerequisites:
      - {p: owner_decision_recorded, args: [abandon_run]}
    on_entry:
      - "write abandonment.run_id_status: retained — a run_id is NEVER reused"
      - "compute abandonment.campaign_id_status from the derivation table (never_minted |
         released | retired) and write identity.campaign_id.status to match"
      - "preserve every artifact and all provenance; delete nothing"
    outbound_transitions: none
    reachable_from: "every nonterminal state before LIVE"
    not_reachable_from: [LIVE, REVIEWED, ABANDONED]
    notes: >
      A LIVE campaign is not abandoned — it proceeds through operational close to REVIEWED.
      Emergency withdrawal of a live campaign is a separate future concept, not abandonment.
    charter_ref: identity_005

# ═══════════════════════════════════════════════════════════════════
# 3a · SETTABLE STATE PATHS  (C1)
# The ONLY paths `run.py set` may write. Everything else in the state file is owned by
# `new`, `record-decision`, `register-artifact` or `transition`. The state file is never
# hand-edited; this list is what makes that rule keepable rather than aspirational.
# Deliberately a small operational whitelist, not a generic any-path mechanism.
# ═══════════════════════════════════════════════════════════════════

settable_paths:
  identity.campaign_id.value:                        {type: string}
  identity.campaign_id.status:                       {type: enum, values: [proposed, confirmed, rejected, retired]}
  identity.campaign_id.confirmed_by_owner:           {type: boolean}
  identity.display_name:                             {type: string}
  execution_tracking.activation_architecture_status: {type: enum, values: [not_started, drafted, approved]}
  execution_tracking.external_handoffs_status:       {type: enum, values: [not_started, authored]}
  execution_tracking.seam6_execution_status:         {type: enum, values: [not_started, ready, validated, executed]}
  collection_freeze:                                 {type: mapping}

not_settable:
  note: >
    workflow.state (transition only) · workflow.history (transition only) · run.* (pinned at NEW)
    · owner_decisions (record-decision only) · artifacts (register-artifact only) ·
    validation_attempts (validate-execution ONLY — a real build appends it; an agent may NOT
    author a passing attempt; invalidated_at/invalidated_by_decision are stamped ONLY by
    run.py reopen and run.py migrate, never authored directly) ·
    verification (verify-live ONLY — computed, not asserted; invalidation stamped by reopen) ·
    identity.campaign_id.externally_referenced and first_external_reference (deferred — these
    trigger immutability and need their own controlled operation) · abandonment (computed on
    entry to ABANDONED) · capability_claims (deferred) · invalidated (deferred to reopen work).

# ═══════════════════════════════════════════════════════════════════
# 3b · ARTIFACT SCHEMA REGISTRY
# Artifact structural validation is a SEPARATE phase from state or transition validation.
# Only artifacts listed here are structurally checked; others are existence-checked only.
# ═══════════════════════════════════════════════════════════════════

artifact_schemas:
  frame:          {schema: schemas/stage0_frame.schema.yaml,   validator: frame}
  stage1_signals: {schema: schemas/stage1_signals.schema.yaml, validator: signals}

validation_phases:
  state:       "state-file structure, pinned versions, identity invariants, artifact presence"
  artifacts:   "stage-artifact structure against its registered stage schema"
  transition:  "edge legality, owner decisions, reopen obligations, target prerequisites"
  not_governed: "campaign-content QUALITY. Whether research or strategy is any good is a
                 human judgement and this validator never rules on it."

# ═══════════════════════════════════════════════════════════════════
# 3c · RESERVED — NOT IMPLEMENTED IN v1
# These hooks are inert. They are NOT operational and no claim of working migration or
# withdrawal enforcement may be made on their behalf.
# ═══════════════════════════════════════════════════════════════════

reserved_not_implemented:
  run.charter_migration:
    status: reserved_v1
    behaviour_today: >
      NO migration path exists. Any charter_version change mid-run is refused outright, whether
      or not run.charter_migration is present. Supplying the key is itself an error, because it
      implies a capability that does not exist.
    refusal: charter_migration_not_supported
  charter.withdrawn_versions:
    status: reserved_v1
    behaviour_today: >
      No withdrawal registry exists. When the key is absent the validator emits a WARNING that
      withdrawal enforcement is INACTIVE and passes. It does not silently imply enforcement.
      If the key is present it is enforced literally.
    warning: "withdrawal enforcement inactive: charter.withdrawn_versions is not defined (reserved, v1)"

# ═══════════════════════════════════════════════════════════════════
# 4 · PATH RESOLUTION
# Maps a prerequisite path root to the document that owns it. The validator resolves
# dotted paths against the state file unless the root appears here.
# ═══════════════════════════════════════════════════════════════════

path_resolution:
  frame:               {artifact: frame}
  stage1:              {artifact: stage1_signals}
  signals:             {artifact: stage1_signals, key: signals}
  opportunities:       {artifact: stage2_opportunities, key: opportunities}
  interview:           {artifact: stage3_interview}
  brief:               {artifact: stage4_brief}
  routes:              {artifact: stage5_routes, key: routes}
  activations:         {artifact: stage6_activation, key: activations}
  delivery:            {artifact: stage6_activation, key: delivery}
  rails:               {artifact: stage7_seam6, key: rails}
  entities:            {artifact: stage7_seam6, key: entities}
  collections:         {artifact: stage7_seam6, key: collections}
  measurement:         {artifact: stage9_measurement}
  review:              {artifact: review}
  # structured front-half objects (spec 1.8.0) — resolve against their registered artifact bytes.
  research_brief:      {artifact: research_brief}
  research_ledger:     {artifact: research_ledger}
  campaign_directions: {artifact: campaign_directions}
  campaign_spec:       {artifact: campaign_spec}
  # everything else resolves against the state file:
  #   run, identity, workflow, owner_decisions, artifacts, execution_tracking,
  #   collection_freeze, capability_claims, validation_attempts, verification, abandonment,
  #   structured_objects, dependency_graph

# ═══════════════════════════════════════════════════════════════════
# 5 · ITEM PREDICATES (used by each_satisfies)
# ═══════════════════════════════════════════════════════════════════

item_predicates:
  exactly_one_collection:
    charter_ref: rail_001
    rule: "item.collection_id is a single non-null scalar. A list, a null, or an empty value fails."
    failure_message: "ERROR: each rail must reference exactly one collection"
  has_rail_position:
    charter_ref: rail_002
    rule: "item.rail_position is a non-null integer >= 0"
    failure_message: "ERROR: rail_position is required for every pinned rail"
  meets_technical_minimum:
    charter_ref: render_001
    rule: "item.eligible_count >= 1"
    failure_message: "ERROR: entity has zero eligible items and cannot render"
  meets_quality_minimum_or_has_exception:
    charter_ref: render_002
    rule: >
      item.eligible_count >= quality_minimums[item.entity_type], OR item.quality_exception
      carries approved: true with approved_by and rationale
    quality_minimums: {products: 12, collections: 10, brands: 12}
    failure_message: "ERROR: entity is below the approved presentation-quality minimum"
    warning_message: "WARNING: entity has limited inventory resilience"

# ═══════════════════════════════════════════════════════════════════
# 6 · TRANSITIONS
# Every transition carries a transition_type. Backward movement is never casual navigation.
# ═══════════════════════════════════════════════════════════════════

transition_types:
  forward:  "advances the run. Prerequisites of the target state must hold."
  reopen:   "returns to an earlier state. Requires an owner decision, records a reason,
             invalidates dependent approvals, and supersedes dependent artifacts."
  terminal: "enters a state with no outbound transitions."

back_edge_rules:
  applies_to: reopen
  charter_ref: governance_001
  requirements:
    - "records the reason on the transition"
    - "invalidates every dependent approval named in `invalidates`"
    - "marks every dependent artifact superseded — NEVER deletes it"
    - "names the owner decision that authorized it"
    - "prevents a stale downstream artifact from satisfying any later gate
       (prerequisites resolve only against artifacts with status: current)"

transitions:

  - {from: NEW,                 to: FRAME_READY,          transition_type: forward}
  - {from: FRAME_READY,         to: RESEARCHING,          transition_type: forward}
  - {from: RESEARCHING,         to: SIGNALS_READY,        transition_type: forward}
  - {from: SIGNALS_READY,       to: OPPORTUNITIES_READY,  transition_type: forward}
  - {from: OPPORTUNITIES_READY, to: OPPORTUNITY_SELECTED, transition_type: forward}

  - from: OPPORTUNITIES_READY
    to: RESEARCHING
    transition_type: reopen
    owner_decision: opportunities_rejected
    transition_reason: deeper_scan_requested
    invalidates: []
    supersedes_artifacts: [stage2_opportunities, stage2_comparison]
    note: >
      Reject-all or request-deeper-scan. The owner is never forced to select from weak options.
      No downstream approval exists yet, so nothing is invalidated — but the superseded
      opportunity set can no longer satisfy the OPPORTUNITIES_READY gate.

  - {from: OPPORTUNITY_SELECTED, to: INTERVIEW_COMPLETE, transition_type: forward}
  - {from: INTERVIEW_COMPLETE,   to: BRIEF_DRAFT,        transition_type: forward}
  - {from: BRIEF_DRAFT,          to: BRIEF_DRAFT,        transition_type: forward,
     note: "Same-state revision round. Unbounded, requires no decision."}
  - {from: BRIEF_DRAFT,          to: BRIEF_APPROVED,     transition_type: forward}

  - from: BRIEF_APPROVED
    to: BRIEF_DRAFT
    transition_type: reopen
    owner_decision: brief_reopened
    transition_reason: brief_reopened
    decision_value_required_fields: [reason, invalidating_finding, affected_artifacts]
    invalidates:
      - route_selected
      - execution_package_approved
      - execution_tracking.activation_architecture_status
      - execution_tracking.seam6_execution_status
      - validation_attempts
    supersedes_artifacts:
      - stage5_routes
      - stage6_activation
      - stage7_seam6
      - products_csv
      - execution_manifest
    cascade_note: >
      Reopening an approved brief invalidates routes, the selected route, the activation
      architecture, the Seam 6 specification, the validation result and campaign approval.
      Artifacts are marked superseded, never deleted. The run returns to BRIEF_DRAFT and
      retains its full history.
    campaign_id_policy:
      externally_referenced: "remains reserved — the id is immutable (charter identity_005)"
      not_externally_referenced: >
        may be released and replaced ONLY through an explicit owner decision, and only if the
        durable occasion or subject has actually changed

  - {from: BRIEF_APPROVED,   to: ROUTES_READY,      transition_type: forward}
  - {from: ROUTES_READY,     to: ROUTE_SELECTED,    transition_type: forward}
  - {from: ROUTE_SELECTED,   to: ACTIVATION_READY,  transition_type: forward}
  - {from: ACTIVATION_READY, to: SEAM6_READY,       transition_type: forward}
  - {from: SEAM6_READY,      to: VALIDATED,         transition_type: forward,
     note: "Requires last_validation_passed. A failed attempt does NOT transition — the run
            remains in SEAM6_READY and appends to validation_attempts."}

  - from: VALIDATED
    to: SEAM6_READY
    transition_type: reopen
    owner_decision: reopen_seam6_execution
    transition_reason: execution_reopened
    applies_when: "an already-validated execution artifact is deliberately changed"
    does_not_apply_to: "an ordinary failed build — that never leaves SEAM6_READY"
    invalidates:
      - execution_package_approved
      - execution_tracking.seam6_execution_status
    supersedes_artifacts:
      - products_csv
      - execution_manifest
    on_transition:
      - "stamp the last validation_attempts entry with invalidated_at and
         invalidated_by_decision — preserve the report as history"
      - "supersede products_csv, execution_manifest and the execution artifacts being changed"
      - "clear every downstream approval that depended on the invalidated result"
      - "require a fresh passing validation attempt before SEAM6_READY -> VALIDATED again"

  - {from: VALIDATED,         to: CAMPAIGN_APPROVED, transition_type: forward}
  - {from: CAMPAIGN_APPROVED, to: LIVE,              transition_type: forward}

  - from: CAMPAIGN_APPROVED
    to: SEAM6_READY
    transition_type: reopen
    owner_decision: reopen_execution_post_approval
    transition_reason: execution_reopened_post_approval
    applies_when: >
      an APPROVED run's execution must be regenerated — the approved execution is stale
      (e.g. canon migration invalidated its proof, or engine truth moved) or is deliberately
      changed. Demonstrated need: Almost Fall r002 regression (2026-08-10) — the run sat one
      state past the only execution reopen edge and could not express the invalidation
      cascade through the sanctioned interface.
    does_not_apply_to: "a LIVE run — post-LIVE change is a separate future concept"
    decision_value_required_fields: [reason]
    invalidates:
      - execution_package_approved
      - execution_tracking.seam6_execution_status
      - validation_attempts
      - verification
    supersedes_artifacts:
      - products_csv
      - execution_manifest
    on_transition:
      - "stamp every non-invalidated passing validation_attempts entry with invalidated_at and
         invalidated_by_decision (writer: run.py reopen) — preserve reports as history"
      - "stamp verification (if present) invalidated the same way — a pre-reopen live probe
         can never satisfy a post-reopen LIVE gate"
      - "supersede products_csv and execution_manifest — NEVER delete"
      - "set execution_tracking.seam6_execution_status back to 'ready'"
      - "execution_package_approved is invalidated: re-entering CAMPAIGN_APPROVED requires the
         owner to RE-RECORD the execution-package approval on the regenerated execution + its NEW
         manifest (record-decision clears the invalidation); the stale approval can never gate again"
    cascade_note: >
      A fresh passing hash-bound validation attempt is required before SEAM6_READY ->
      VALIDATED, and a fresh owner approval before VALIDATED -> CAMPAIGN_APPROVED. Artifacts
      are superseded, never deleted; the run retains full history.

  - {from: LIVE,              to: REVIEWED,          transition_type: forward}

  - from: ANY_PRE_LIVE
    to: ABANDONED
    transition_type: terminal
    owner_decision: abandon_run
    expands_to: [NEW, FRAME_READY, RESEARCHING, SIGNALS_READY, OPPORTUNITIES_READY,
                 OPPORTUNITY_SELECTED, INTERVIEW_COMPLETE, BRIEF_DRAFT, BRIEF_APPROVED,
                 ROUTES_READY, ROUTE_SELECTED, ACTIVATION_READY, SEAM6_READY, VALIDATED,
                 CAMPAIGN_APPROVED]
    note: "Not reachable from LIVE or REVIEWED. A live campaign proceeds to operational close."

# ═══════════════════════════════════════════════════════════════════
# 7 · REFUSALS — the validator exits non-zero and names every failure
# ═══════════════════════════════════════════════════════════════════

refusals:
  spec_version_changed_mid_run:
    charter_ref: governance_001
    message: "spec_version is pinned for the life of the run. Refusing."
  run_mode_mutated:
    message: "run.run_mode is a run-level identity, immutable after NEW. It differs from the
              value pinned at NEW. Refusing — a run cannot change its authority mode."
  run_mode_invalid:
    message: "run.run_mode must be one of {production, diagnostic}. Refusing."
  charter_version_changed_without_migration:
    charter_ref: governance_001
    message: "charter_version changed with no migration record. A new charter does not
              auto-migrate an active run. Refusing."
  run_canon_version_mismatch:
    charter_ref: governance_001
    message: "The run's pinned spec/charter version differs from the on-disk canon the
              validator loaded (Model B: rules are always evaluated against current canon).
              An un-migrated run would be judged under rules it never adopted. Run
              `run.py migrate` to record an explicit migration, then retry. Refusing."
  withdrawn_version_loaded:
    message: "Pinned spec or charter version is withdrawn. Refusing."
  charter_not_approved:
    charter_ref: governance_001
    message: "NEW -> FRAME_READY requires an approved pinned charter. Refusing."
  prerequisites_unmet:
    message: "Entry prerequisites failed. Every failed predicate is listed with its path and
              expected value. Refusing."
  illegal_transition:
    message: "No transition exists from <current> to <target>. Refusing."
  closing_sentence_is_not_proof:
    message: "A transition requiring owner_decision_recorded cannot proceed on conversational
              inference. The model asserting that a stage is complete is not evidence."
  decision_status_misstamped:
    charter_ref: governance_003
    message: "An owner_decisions entry sets decided_by: product_owner (or decided: true) without
              status owner_confirmed. Engine fulfillment and agent recommendations are never
              owner decisions; product_owner is valid only on an owner_confirmed entry. Refusing."
  reopen_without_decision:
    charter_ref: governance_001
    message: "A reopen transition requires its named owner decision, a recorded reason, and
              supersession of every dependent artifact. Refusing."
  stale_artifact_treated_as_current:
    message: "Prerequisite <p> resolved against artifact <key>, which is superseded. A
              superseded artifact can never satisfy a gate. Refusing."
  artifact_deleted:
    message: "Artifact <key> is referenced by run history but missing from disk. Artifacts are
              superseded, never deleted. Refusing."
  validation_failure_treated_as_transition:
    message: "A failed validation attempt does not move the run. VALIDATED means validation
              passed. Remain in SEAM6_READY and append to validation_attempts. Refusing."
  abandon_after_live:
    charter_ref: identity_005
    message: "ABANDONED is not reachable from LIVE or REVIEWED. A live campaign proceeds
              through operational close to REVIEWED. Refusing."
  campaign_id_mutated_after_external_reference:
    charter_ref: identity_005
    message: "campaign_id is immutable from first external reference. Renaming requires a
              migration, not an edit. Refusing."
  campaign_id_collision:
    charter_ref: identity_006
    message: "Another active or externally-referenced campaign owns this occasion-year id.
              Fail, or explicitly join the existing campaign. Refusing."
  run_id_reused:
    charter_ref: identity_002
    message: "run_id is never reused, including after abandonment. Refusing."
  capability_claimed_while_pending:
    message: "The run claims <capability>, which an unpassed charter pending_validation blocks.
              Refusing."
  frozen_collection_modified:
    charter_ref: constraint_repo_005
    status: not_yet_enforced   # POST-LIVE operational integrity, NOT a launch gate (owner 2026-08-09)
    scope_ruling: >
      Freeze detection is POST-LIVE operational integrity, not part of the initial LIVE gate:
      a collection can only be modified AFTER it is frozen at go-live, so this never blocks the
      launch transition. Real enforcement needs an engine collection-diff (live contents vs the
      freeze snapshot's per-collection sha256) — a NEXT_PASS item. This refusal string is
      retained for when that writer lands; it is NOT enforced today (the former check read a
      phantom field and was removed in the 2026-08-09 hardening pass).
    message: "Collection <id> is frozen from LIVE. A material change requires a new versioned
              collection; an emergency correction requires a recorded exception with reason,
              approved_by, approved_at, affected_collection_id and change_summary. Refusing."
  artifact_structure_invalid:
    message: "A registered stage artifact failed structural validation against its stage schema.
              Structure only — content quality is not judged here. Refusing."
  charter_migration_not_supported:
    message: "run.charter_migration is RESERVED and unimplemented in v1. Charter migration does
              not exist; a charter_version change mid-run is refused outright. Refusing."
  handoff_reported_as_implemented:
    charter_ref: scope_002
    message: "external_handoffs_implemented may only be set from an explicit owner report,
              never inferred from external_handoffs_status. Refusing."
  stale_execution_proof:
    charter_ref: governance_001
    message: "execution_tracking.seam6_execution_status asserts 'validated' but the run holds
              no live current-canon proof: the last non-invalidated passing validation attempt
              must be a production build hash-bound to the CURRENT products_csv. A migrated
              run may not remain semantically post-VALIDATED on proof the current canon would
              refuse — run.py migrate stamps such proof invalid and downgrades the status;
              regenerate via validate-execution. Refusing."
  stale_decision_after_reopen:
    charter_ref: governance_001
    message: "owner decision <id> was invalidated by a reopen and cannot gate a transition
              until the owner re-records it on the regenerated work. Refusing."
  structured_object_missing:
    message: "A vNext run (spec >= 1.8.0) requires the structured front-half object <kind>
              (research_brief | research_ledger | campaign_directions | campaign_spec), registered
              and current. The object is the front-half AUTHORITY (owner ruling 2026-08-12); prose
              artifacts are derived/historical, never a substitute. Refusing."
  structured_object_hash_mismatch:
    message: "structured_objects.<kind>.canonical_hash disagrees with the hash recomputed from the
              artifact bytes on disk. The spine hash is never hand-authored — it is recomputed by
              register-object. Refusing."
  campaign_spec_section_missing:
    message: "The current campaign_spec revision is missing a required section hash (<section>).
              Every named section must carry a non-empty canonical section_hash. Refusing."
  campaign_spec_revision_mutated:
    message: "A campaign_spec revision is write-once. Two records share the same id+revision with
              differing canonical_hash — a revision was edited in place instead of minting a new one.
              Refusing."
  approval_not_bound_to_object:
    message: "The front-half approval <id> does not bind the EXACT current object it must approve
              (object_id + revision + canonical_hash / section_hash / composite_hash). An approval
              bound to a superseded revision, a changed section, or missing binding fields can never
              gate — a stale approval cannot silently authorize a different revision. Refusing."
  direction_selection_not_bound:
    message: "The direction selection <id> does not bind a direction that exists in the current
              campaign_directions with a matching per-direction hash. A changed direction set makes a
              prior selection stale. Refusing."
  front_half_approval_stale:
    message: "The front-half approval <id> was invalidated by a dependency change or reopen and
              cannot gate until the owner re-records it on the current object (dependency invalidation
              is deterministic — dependency_graph, not agent discretion). Refusing."

# ═══════════════════════════════════════════════════════════════════
# 8 · RULINGS APPLIED IN 1.1.0
# ═══════════════════════════════════════════════════════════════════

rulings_applied:
  - id: abandoned_state
    decision: accepted
    detail: "Terminal, owner-decision-gated, reachable from every nonterminal pre-LIVE state.
             Classifies campaign_id as never_minted | released | retired; run_id retained and
             never reused; all artifacts and provenance preserved; no outbound transitions."
  - id: failed_validation_backedge
    decision: rejected
    detail: "Validation is an attempted action inside SEAM6_READY, not a transition. A failed
             build appends to validation_attempts and the run does not move. VALIDATED now
             means validation passed."
  - id: validated_to_seam6_reopen
    decision: accepted_as_reopen
    detail: "Kept only for deliberately changing an artifact that previously passed. Named
             execution_reopened, gated on reopen_seam6_execution, invalidates the prior result
             while preserving its report, clears dependent approvals, requires fresh validation."
  - id: brief_approved_reopen
    decision: accepted_as_reopen
    detail: "Gated on brief_reopened with reason, invalidating_finding and affected_artifacts.
             Cascades to routes, route selection, activation, Seam 6, validation and campaign
             approval. Artifacts superseded, never deleted."
  - id: artifact_deletion
    decision: rejected
    detail: "Automatic deletion of downstream artifacts is refused. Supersession is required."
  - id: transition_type
    decision: added
    detail: "forward | reopen | terminal, on every transition, with back_edge_rules governing
             reopen."
