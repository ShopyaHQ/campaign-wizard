    status: approved_rule
    approved_in_version: 0.2.0
    claim: >
      Campaign collections remain editable before LIVE. At LIVE, every externally
      referenced campaign collection becomes frozen. Material post-launch changes
      require a new versioned collection. Emergency corrections require a recorded
      exception.
    rationale: "Reproducibility, measurement integrity, and reliable handoffs."
    lifecycle:
      editable_states:
        - NEW
        - FRAME_READY
        - RESEARCHING
        - SIGNALS_READY
        - OPPORTUNITIES_READY
        - OPPORTUNITY_SELECTED
        - INTERVIEW_COMPLETE
        - BRIEF_DRAFT
        - BRIEF_APPROVED
        - ROUTES_READY
        - ROUTE_SELECTED
        - ACTIVATION_READY
        - SEAM6_READY
        - VALIDATED
        - CAMPAIGN_APPROVED
      frozen_from_state: LIVE
    enforcement:
      validator_required: true
      api_enforced: false
    exception:
      permitted: true
      required_fields:
        - reason
        - approved_by
        - approved_at
        - affected_collection_id
        - change_summary
    sources:
