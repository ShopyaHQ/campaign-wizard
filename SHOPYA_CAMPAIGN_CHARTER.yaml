# SHOPYA CAMPAIGN CHARTER
# Machine-readable product and campaign contract. Read by the state validator.
# No campaign run may pass NEW -> FRAME_READY unless the pinned charter version is approved.
#
# status:
#   implemented   - directly verified in product code or an authoritative technical contract
#   position      - approved PRODUCT, BRAND, or STRATEGIC position
#   approved_rule - approved GOVERNANCE or OPERATING rule (workflow, validation, execution,
#                   identity, lifecycle, thresholds). Enforced by the wizard, not by the product
#   proposed      - rule or interpretation still awaiting a decision
#   unknown       - cannot currently be established
#
# position and approved_rule are NOT interchangeable. A brand promise is a position;
# a validator invariant is an approved_rule.
#
# Proposed and inferred claims are NEVER silently promoted to product truth.

charter:
  version: 0.2.0
  status: approved
  approved_by: product_owner
  approved_at: 2026-08-06T15:00:27Z
  supersedes: 0.1.0

  approval:
    rationale: >
      All owner decisions of 2026-08-06 are recorded as claims. Every unresolved item is
      classified as blocking_charter_approval, blocking_capability, or accepted_nonblocking.
      No item blocks charter approval.
    effect: >
      Approval promotes every proposed governance or operating rule to approved_rule and clears
      requires_owner_confirmation on it. Product, brand and strategic positions remain position.
      Claims with status unknown are NOT promoted — approval cannot resolve an open question —
      and retain requires_owner_confirmation: true.
    status_vocabulary_note: >
      approved_rule was added in this revision. Promoting operating rules to position overloaded
      that status: position is reserved for product, brand and strategic positions, while
      validator rules, state transitions, rail invariants, scheduling disclosures and lifecycle
      controls are approved operating rules.
    rulings_applied:
      - "constraint_repo_005: absolute never-edited rule REJECTED; replaced by a lifecycle
         rule (editable before LIVE, frozen at LIVE, versioned collection for material
         post-launch change, recorded exception for emergencies). Validator-enforced, not
         API-enforced."
      - "scheduling_002: DOWNGRADED to proposed / partially_verified. Direct inspection of
         composed-assets.ts was required and is impossible from this session — shopya-frontend
         is not a connected folder." 

  evidence_base:
    - source: shopya-frontend provenance audit
      commit: e137b56d
      audited_at: 2026-08-06
      authority: authoritative until a live sync is built (v2)
      coverage_gaps:
        - "api-develop unreadable (stale snapshot, no feeds code). Backend claims rest on
           committed OpenAPI + admin-develop client + live staging probes."
        - "First-party event storage (ghostframe2025) not audited."
        - "Sanity dataset contents not audited (schema/loader code only)."
    - source: shopya-campaign-wizard/scripts
      authority: repository operational contract, read directly 2026-08-06
    - source: shopya-collection-curation
      authority: sibling curation engine contracts, read 2026-08-06
    - source: owner decisions
      recorded: 2026-08-06
      authority: product-owner rulings on scope, identity, scheduling, rails, thresholds

  # Pending validations do NOT block charter approval. Each blocks only a named capability.
  # Until a validation passes, its capability is unavailable to campaign execution.
  pending_validations:
    - id: s6_window_semantics
      blocking_for:
        - claiming_s6_window_scheduling_verified
      blocking_for_charter_approval: false
      test_matrix:
        - "future start: absent before threshold, present after"
        - "expired end: absent after threshold"
        - "current valid window: present"
        - "is_active false: absent  (REGRESSION case, not an unknown)"
        - "exact start/end boundary and timezone normalization"
    - id: collection_item_order_persistence
      blocking_for:
        - claiming_persisted_collection_item_order
      blocking_for_charter_approval: false
      test_matrix:
        - "initial creation order"
        - "additions after creation"
        - "removals and re-additions"
        - "bulk import"
        - "API retrieval order"
        - "admin edits"
      notes: "Initial creation order alone does not establish a durable ordering contract."
    - id: first_party_event_retrieval
      blocking_for:
        - claiming_L3_by_evidence
        - claiming_wizard_queryable_measurement
      blocking_for_charter_approval: false
    - id: list_viewed_firing_semantics
      blocking_for:
        - using_commerce_list_viewed_as_exposure_denominator
      blocking_for_charter_approval: false
    - id: rail_view_all_destination
      blocking_for:
        - claiming_rail_links_to_collection_page
      blocking_for_charter_approval: false
    - id: explore_default_set_normalization
      blocking_for:
        - restoring_proportional_page_share_guardrail
      blocking_for_charter_approval: false
    - id: sanity_window_production_path
      blocking_for:
        - claiming_sanity_window_scheduling_production_verified
      blocking_for_charter_approval: false
      test_matrix:
        - "predicate present at lib/sanity/composed-assets.ts:40-44"
        - "production asset-loading path demonstrably uses that query"
      notes: "Requires shopya-frontend to be reachable. See scheduling_002." 

  unresolved_claims: []   # none block charter approval

