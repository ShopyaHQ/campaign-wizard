    decided_at: '2026-08-07T07:40:52Z'
    value:
      opportunity_id: OPP-01
      reshaped: true
      premise: 'Fashion has moved into fall before the weather has. That creates a
        gap between what shoppers are beginning to want and what they can realistically
        wear now. Shopya turns that gap into a useful discovery behavior: save what
        belongs to the season ahead, while finding the signals of that season that
        already work now. The campaign is about wanting ahead without having to resolve
        that desire immediately.'
      arguable_claim: You can want fall before you need to buy or wear it. Saving
        gives that desire somewhere to go.
    note: 'Basis: owner''s written reshape 2026-08-06, verbatim. Owner rejected: six-week
      precision, ''most of what is worth wanting'' breadth, anti-commerce/anti-urgency
      as the campaign stance, and predetermining the wait-vs-wear collection split
      — that split is a hypothesis for the deeper research pass, not architecture.'
    status: owner_confirmed
