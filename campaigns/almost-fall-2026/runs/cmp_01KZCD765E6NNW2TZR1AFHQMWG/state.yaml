owner_decisions:
  frame_accepted:
    decided: true
    decided_by: product_owner
    decided_at: '2026-08-06T20:49:08Z'
    note: 'Basis: all frame inputs supplied explicitly by owner via kickoff questions
      this session (objective=more saves; territory=seasonal turn; timing=ASAP next
      week; exclusions=three, superset reading of dual selection, flagged in chat).
      Frame transcribes those answers. Agent-labeled: launch-window normalization,
      US market carried as proposal pending confirmation.'
  opportunity_selected:
    decided: true
    decided_by: product_owner
    decided_at: '2026-08-07T07:40:52Z'
    value:
      opportunity_id: OPP-01
      reshaped: true
      premise: 'Fashion has moved into fall before the weather has. That creates a
        gap between what shoppers are beginning to want and what they can realistically
        wear now. Shopya turns that gap into a useful discovery behavior: save what
        belongs to the season ahead, while finding the signals of that season that
        already work now. The campaign is about wanting ahead without having to resolve
        that desire immediately.'
      arguable_claim: You can want fall before you need to buy or wear it. Saving
        gives that desire somewhere to go.
    note: 'Basis: owner''s written reshape 2026-08-06, verbatim. Owner rejected: six-week
      precision, ''most of what is worth wanting'' breadth, anti-commerce/anti-urgency
      as the campaign stance, and predetermining the wait-vs-wear collection split
      — that split is a hypothesis for the deeper research pass, not architecture.'
  collection_architecture_workshopped:
    decided: true
    decided_by: product_owner
    decided_at: '2026-08-07T07:58:45Z'
    value:
      keep:
      - CR-A
      - CR-B
      - CR-D
      mechanisms: wait -> bridge -> transform
      alternate_preserved: 'CR-C rejected-for-this-premise, high-value; possible future
        campaign: the season arrives at home before it arrives outside'
      cut:
      - CR-E
      constraints:
      - do not merge D into B unless product reality forces it
      - next step is availability testing of A/B/D only
      - no naming or copy yet
    note: 'Basis: owner''s written architecture ruling 2026-08-07. Causal correction
      recorded: CR-C breaks the locked premise (home has no weather problem) and would
      silently broaden a fashion/weather campaign into general early-fall experience.'
  curation_pass_approved:
    decided: true
    decided_by: product_owner
    decided_at: '2026-08-07T08:02:22Z'
    value:
      scope:
      - 'A top-up: trenches, toggles, capes/ponchos, statement coats — current, weather-gated'
      - 'D fill: belts, brooches, shrugs, cardigans — genuinely transform-supporting'
      - 'B: leopard thread check only'
      success: 12+ verified-available, editorially defensible per A and D; relevance
