- opportunity_id: OPP-01
  territory: "Fall you cannot wear yet — the save as the waiting room"
  observation: "Retail and editorial have fully turned to fall while the heat makes none of it wearable; early fall pieces are already selling out."
  cultural_tension: "The trade says decide now; the weather says not for six weeks. The shopper is asked to commit to clothes she cannot put on."
  audience_behavior: "Browsing fall content in summer heat with no immediate wear occasion; outerwear is the one category searched with a year tag."
  why_now: "The gap between what is sold and what is wearable is at its annual maximum this exact week (SIG-004, SIG-006, SIG-007, SIG-014)."
  shopya_role: "Saving is the honest verb for wanting something you cannot wear yet. The platform's core gesture is the correct response to the moment; no retailer can say 'don't buy it yet' — a discovery platform can."
  desired_user_action: "Save fall pieces now; return when the weather turns."
  instrumentation_mapping: save.created
  supporting_signal_ids: [SIG-004, SIG-006, SIG-007, SIG-013, SIG-014]
  contradicting_signal_ids: [SIG-011]
  relevant_seams: [S6, S5]
  surface_potential: [explore, collection_pages]
  ownability:
    level: L3-by-capability
    rationale: "The mechanism IS the save-then-return loop. Transplanted to a retailer it becomes 'shop the preview', which is a different and weaker thing; a retailer's incentive is to sell now, not to hold."
    dependency: "charter product_truth_001, product_truth_002"
  expiration: "Decays as real fall weather arrives (mid-late September); natural 4-6 week arc into Labor Day and NYFW."
  confidence: strong
  assumptions: ["That browsing fall content in August is widespread enough to convert into saves — inferred from editorial volume, not measured."]
  operational_risks: ["Tight window means S6-only execution; the idea must read inside default page dressing."]

