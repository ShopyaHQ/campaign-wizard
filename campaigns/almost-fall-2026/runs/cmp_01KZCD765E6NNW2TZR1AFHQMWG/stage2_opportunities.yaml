    dependency: none
  expiration: "4-6 weeks; dies when real layering weather arrives and the construction becomes ordinary."
  confidence: moderate
  assumptions: ["That editor styling predictions reflect real audience appetite rather than one editor's taste."]
  operational_risks: ["Styling content leans on the editorial seam (S5), which is handoff and may not land inside the window."]

