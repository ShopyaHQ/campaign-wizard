  audience_behavior: "Styling-led browsing; layering constructions dominate the predictions; underconsumption mood persists."
  why_now: "The styling story of this exact fortnight (SIG-005), aligned with the value-conscious outlook (SIG-011, SIG-012)."
  shopya_role: "Cross-brand styling assemblies are discovery work — a single retailer shows its own racks; a platform can show the construction."
  desired_user_action: "Save the pieces that convert a summer wardrobe — shrugs, layers, the one bag."
  instrumentation_mapping: save.created
  supporting_signal_ids: [SIG-005, SIG-011, SIG-012]
  contradicting_signal_ids: [SIG-007]
  relevant_seams: [S6, S5]
  surface_potential: [explore, collection_pages]
  ownability:
    level: L2
