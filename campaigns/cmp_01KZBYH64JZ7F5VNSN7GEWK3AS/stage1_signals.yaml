    query: "what to wear in september"
    returned_terms: [in italy, "(bare term)", in paris, in ireland, in japan, in portugal, in london, in new york, in switzerland, in greece]
    provider: "Google suggestqueries, client=firefox"
    geography: US
    language: en
    session_conditions: "Server-side fetch, no user session, no personalisation, no cookies."
    observed_at: 2026-08-06T15:58:00Z
    reproducibility_notes: "Unstable over time and localised. Re-probe before reuse."
