- signal_id: SIG-005
  claim: "Anti-overconsumption is a sustained multi-year position, not a passing hashtag."
  evidence_type: cultural_or_editorial
  source: "Creative Salon, TikTok anti-overconsumption and deinfluencing"
  source_date: 2024-03-04
  observed_date: 2026-08-06
  geography: global
  direct_observation: "Documents #deinfluencing and the 'Rule of 5' (five fashion purchases a year), attributed to Gen Z and Gen Alpha concern about waste and climate."
  interpretation: "A durable audience position rather than a seasonal mood, which matters for a campaign that asks people to save rather than buy."
