# ══ temporal_catalyst ═════════════════════════════════════════════
- signal_id: SIG-024
  claim: "Spring 2027 fashion month falls inside this run's planning horizon."
  evidence_type: temporal_catalyst
  source: "Fashionista, Spring 2027 fashion month schedules; CFDA preliminary NYFW schedule"
  source_date: 2026-07
  observed_date: 2026-08-06
  geography: "New York, London, Milan, Paris"
  direct_observation: "New York begins 2026-09-10 with debuts from Conner Ives, Magda Butrym and Zaldy; Milan begins 2026-09-25 with new Moschino creative directors; Paris runs 2026-09-28 to 2026-10-06 with Carven and Courrèges debuts. The planning horizon of four to six weeks from 2026-08-06 ends between 2026-09-03 and 2026-09-17."
  interpretation: "A dense, dated attention spike sits inside the window; at four weeks the horizon ends before New York opens and at six weeks it ends during it."
  confidence: strong
  limitations: "Schedules described as preliminary and subject to change. Fashion week drives industry and enthusiast attention; its reach into a general audience is unmeasured here."

- signal_id: SIG-025
  claim: "The traditional East Asian calendar marks the beginning of autumn in the first week of August, at the hottest point of the year."
  evidence_type: temporal_catalyst
  source: "Japan's 72 microseasons (TokyoPony; Nippon.com)"
  source_date: null
  observed_date: 2026-08-06
  geography: Japan
  direct_observation: "立秋 Risshū, 'beginning of autumn', falls 2026-08-07. The microseasons following it are 涼風至 'cool winds blow' (Aug 8-12), 寒蝉鳴 'evening cicadas sing' (Aug 13-17), 蒙霧升降 'thick fog descends' (Aug 18-22), then 処暑 Shosho, 'manageable heat', from about Aug 23. Japanese also has 残暑, zansho, for heat persisting after autumn has formally begun."
  interpretation: "A calendar that names this specific gap between formal season and felt weather is evidence the gap is a durable human observation rather than a merchandising conceit."
  confidence: strong
  limitations: "Japanese, not US. Cultural reference material with no bearing on US demand. Popular-explainer sources rather than a scholarly calendar."

- signal_id: SIG-026
  claim: "Several unrelated European languages have a dedicated name for the late-warm spell, and two personify it as an old woman."
  evidence_type: temporal_catalyst
  source: "The Local (German word of the day: Altweibersommer); Wiktionary"
  source_date: 2025-08-28
  observed_date: 2026-08-06
  geography: "German-speaking Europe; Slavic Europe; Sweden"
  direct_observation: "German Altweibersommer, 'old women's summer', named for Altweiberfäden, the gossamer spider threads that float in early autumn. Slavic babje leto, 'grandmother's summer'. Swedish Brittsommar, after St Bridget."
  interpretation: "Independent naming across languages indicates the moment is widely recognised. The old-woman personification is a shared image, not a universal one — the Swedish term is a saint's day."
  confidence: moderate
  limitations: "Popular-etymology source; folk etymologies are frequently disputed. European, not US. No relevance to demand."

