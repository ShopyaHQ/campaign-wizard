  limitations: "The date is a fact; that it drives behaviour is not established here. Labor Day is also a major discount weekend, and discount framing is excluded by the frame."

- signal_id: SIG-028
  claim: "Michaelmas, 29 September 2026, carries a folk deadline for picking blackberries."
