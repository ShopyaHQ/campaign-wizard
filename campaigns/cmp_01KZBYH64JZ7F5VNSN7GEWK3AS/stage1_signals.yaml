  observed_date: 2026-08-06
  geography: "not stated"
  direct_observation: "Reports that users read cart placement as 'I might want that' and wishlist placement as 'I definitely want that'; that participants were reluctant to use wishlists because of expected registration burden; and that the word 'wishlist' carried a gift-sharing connotation users found uncomfortable."
