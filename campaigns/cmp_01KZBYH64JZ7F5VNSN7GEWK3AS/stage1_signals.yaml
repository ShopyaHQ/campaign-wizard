# ══ demand_or_behavioral ══════════════════════════════════════════
- signal_id: SIG-006
  claim: "'What to wear in September' is a travel-packing query, not a seasonal-dressing query."
  evidence_type: demand_or_behavioral
  source: "Google public autocomplete"
  source_date: null
  observed_date: 2026-08-06
  geography: US
  direct_observation: "All ten completions are destinations: Italy, Paris, Ireland, Japan, Portugal, London, New York, Switzerland, Greece, plus the bare term. Not one is about dressing for the season at home."
  interpretation: "The obvious phrase for this moment is occupied by a different intent. Naming anything after it would attract the wrong audience."
  confidence: strong
  limitations: "Autocomplete is ordering, not volume. A separate seasonal intent may exist below the visible completions."
