  source_date: null
  observed_date: 2026-08-06
  geography: US
  direct_observation: "2026-09-07 is the first Monday of September. Autocomplete separately returns 'white after labor day' as a live completion (SIG-008)."
  interpretation: "A dated moment exists where a permission question people are already asking becomes topical."
