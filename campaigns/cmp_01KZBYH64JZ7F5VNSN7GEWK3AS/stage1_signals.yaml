stop_condition_met: true
stop_condition_basis: >
  28 signals across all six families. Later queries returned material already represented
  (transitional-dressing editorial, deinfluencing coverage, fall runway roundups), and the two
  sources that would have added genuinely new information were unreadable. Enough to form 4-6
  evidence-backed opportunities; continuing would have added volume, not information.

deviations:
  - "Autocomplete was used 16 times across this run and the preparatory session. It is one
     optional family member, not the backbone: 10 of 28 signals are autocomplete-derived and
     none of the six families rests on it alone."
  - "Nine signals (SIG-001..003, SIG-006, SIG-008..013, SIG-019) were observed 2026-08-06/07
     during preparatory work, before the run's frame existed. They are real, dated and sourced,
     and are carried in rather than re-gathered. Flagged as LRN-011: the schema has no field
     distinguishing in-run from carried evidence."
  - "Prior Shopya campaigns were excluded from this scan (charter governance_002, novelty
     desired). They remain available for later duplication checks."

unavailable_data:
  - "Search volume, keyword difficulty and rising-vs-flat trend direction. Would require a paid
     tool. Never estimated."
  - "Social engagement figures beyond what a source itself states."
  - "Sell-through and inventory-depletion data."
  - "First-party Shopya behaviour: site search logs, save/click data, Search Console.
     Charter user_behavior_004, measurement_003, measurement_004."
  - "The findings of SIG-015 ('Heart it or cart it'). The paper exists and is identified; both
     the publisher page (robots-disallowed) and the ProQuest record (403) were unreadable. The
     single most on-objective source in the scan could not be read."

signals:

# ══ cultural_or_editorial ═════════════════════════════════════════
- signal_id: SIG-001
  claim: "Pinterest's 2026 forecast organises its predictions under emotional comfort and belonging, curating not copying, and grounded optimism."
  evidence_type: cultural_or_editorial
  source: "Pinterest Predicts 2026 (business.pinterest.com / newsroom.pinterest.com)"
  source_date: 2025-12
  observed_date: 2026-08-06
  geography: global
  direct_observation: "The report names three overarching themes and 21 trends beneath them."
  interpretation: "Two of the three themes describe a curatorial rather than acquisitive posture, which is the posture a save-driven product already serves."
  confidence: moderate
  limitations: "Vendor report from a platform selling ad inventory against its own predictions; self-reported 88% historical accuracy. Framing is marketing; the percentages are platform search data."

- signal_id: SIG-002
  claim: "'Niche perfume collection' rose 500% in Pinterest search, the largest single figure in the 2026 report."
  evidence_type: cultural_or_editorial
  source: "Pinterest Predicts 2026, Scent Stacking"
  source_date: 2025-12
  observed_date: 2026-08-06
  geography: global
  direct_observation: "+500% on 'niche perfume collection'; +125% on 'perfume layering'."
  interpretation: "The verb is collecting, not buying. A collection is assembled over time and revisited, which is browse-and-save behaviour rather than transaction behaviour."
  confidence: moderate
  limitations: "Vendor figure with no absolute base. A 500% rise on a small base is a small number. Fragrance may not be a category this platform serves."

- signal_id: SIG-003
  claim: "Poetcore is the one Pinterest-named 2026 aesthetic that has crossed into Google search behaviour."
  evidence_type: cultural_or_editorial
  source: "Pinterest Predicts 2026 ('poet aesthetic' +175%) cross-checked against Google autocomplete"
  source_date: 2025-12
  observed_date: 2026-08-06
  geography: US
  direct_observation: "Autocomplete on 'poetcore' returns ten fashion-intent completions with no contamination. Autocomplete on 'brooch' — also a named 2026 trend — returns definitional and bridal completions instead."
  interpretation: "Crossing platforms distinguishes a trend with independent momentum from one confined to the platform that named it."
  confidence: moderate
  limitations: "Two terms tested, not the full 21. Crossing is not the same as scale, and no volume figure is available for either."

- signal_id: SIG-004
  claim: "US August 2026 fashion buy-lists are explicitly transitional and say so in their own copy."
