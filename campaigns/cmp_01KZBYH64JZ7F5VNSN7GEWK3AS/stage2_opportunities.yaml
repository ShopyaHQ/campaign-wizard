  observation: "Displaying abundance now carries social risk; displaying taste does not."
  cultural_tension: "People still want things but no longer want to be seen wanting things."
  audience_behavior: "Curating publicly, buying privately."
  why_now: "Underconsumption-core has persisted two years; the industry outlook is low-growth and value-conscious."
  shopya_role: "Public collections let taste be displayed without a purchase being displayed."
  desired_user_action: "Build and make public a collection."
  instrumentation_mapping: "save.created (collection public/featured flags are not in the instrumented event taxonomy — UNINSTRUMENTED, disclosed per charter behavior_rule_002)"
  supporting_signal_ids: [SIG-021, SIG-005, SIG-001, SIG-016]
  contradicting_signal_ids: [SIG-023, SIG-022]
  relevant_seams: [S4, S5, S6]
  surface_potential: [explore, collection_pages]
  ownability:
    level: L3-by-capability
    rationale: "Public user collections are a verified capability (charter product_truth_002) and are the mechanism itself."
    dependency: "charter product_truth_002"
  expiration: "Evergreen."
  confidence: weak
  assumptions: ["That the restraint position describes this audience. SIG-023 says it is loud and numerically tiny."]
  operational_risks: ["Making a collection public is uninstrumented; success would be unmeasurable even in principle."]
