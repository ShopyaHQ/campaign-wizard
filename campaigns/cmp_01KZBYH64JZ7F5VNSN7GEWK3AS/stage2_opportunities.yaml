  territory: "Transitional dressing, literally"
  observation: "'Transitional' is the one phrase in this territory carrying real search intent, and it names summer-to-fall explicitly."
  cultural_tension: "The wardrobe has to do two seasons at once for six weeks."
  audience_behavior: "Searching the term and looking up what it means."
  why_now: "Year-tagged variants are still on 2025; the 2026 versions have not accumulated."
  shopya_role: "Cross-brand assembly of a look no single retailer merchandises as one thing."
  desired_user_action: "Save multi-season pieces."
  instrumentation_mapping: save.created
  supporting_signal_ids: [SIG-007, SIG-004, SIG-010, SIG-019]
  contradicting_signal_ids: [SIG-012, SIG-013]
  relevant_seams: [S6]
  surface_potential: [explore, collection_pages]
  ownability:
    level: L1
    rationale: "Any retailer runs this every August. Nothing about it requires this product."
    dependency: none
  expiration: "Six to eight weeks."
  confidence: strong
  assumptions: ["That search intent on the term converts to browse behaviour."]
  operational_risks: ["Generic. High chance of producing a merchandising plan rather than a campaign."]

- opportunity_id: OPP-04
  territory: "Fashion month as attention catalyst"
  observation: "Spring 2027 fashion month runs 10 Sep to 6 Oct, inside the horizon."
  cultural_tension: "Runway attention peaks precisely when nobody can buy or wear any of it."
  audience_behavior: "Looking at clothes with no purchase intent — pure browse."
  why_now: "Dated: New York 09-10, Milan 09-25, Paris 09-28 to 10-06, with named debuts."
  shopya_role: "Saving is the natural response to something you cannot buy for six months."
  desired_user_action: "Save runway-adjacent product during the shows."
  instrumentation_mapping: save.created
  supporting_signal_ids: [SIG-024, SIG-019, SIG-020]
  contradicting_signal_ids: [SIG-016]
  relevant_seams: [S2, S5, S6]
  surface_potential: [explore, collection_pages]
  ownability:
    level: L2
    rationale: "The save-what-you-cannot-buy logic fits the product, but every fashion publisher covers fashion month."
    dependency: "charter product_truth_001"
  expiration: "Hard stop 2026-10-06."
  confidence: moderate
  assumptions: ["That fashion month reaches a general audience, not only the trade. Unmeasured."]
  operational_risks: ["At a four-week horizon the window closes before New York opens."]

- opportunity_id: OPP-05
