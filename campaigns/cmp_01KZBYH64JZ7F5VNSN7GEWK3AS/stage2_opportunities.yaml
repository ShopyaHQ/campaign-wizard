opportunities:

- opportunity_id: OPP-01
  territory: "Permission at a season boundary"
  observation: "People search for permission to wear things at the turn, and a dated hinge for that convention falls inside the horizon."
  cultural_tension: "Retail says the season has changed; the weather has not; the shopper does not know what she is allowed to wear."
  audience_behavior: "Asking timing questions rather than product questions."
  why_now: "Labor Day 2026-09-07 sits inside the planning horizon and is the hinge of the best-known US dress-timing convention."
  shopya_role: "A platform holding no inventory can credibly say 'not yet' about a category it does not need to move."
  desired_user_action: "Save items flagged as wearable now rather than wearable later."
  instrumentation_mapping: save.created
  supporting_signal_ids: [SIG-008, SIG-027, SIG-011, SIG-004]
  contradicting_signal_ids: [SIG-006]
  relevant_seams: [S5, S6]
  surface_potential: [explore, collection_pages]
  ownability:
    level: L2
    rationale: "Uses the no-inventory position, but any editorial publisher could run the same permission angle. Not mechanism-dependent."
    dependency: "none verified"
  expiration: "Decays sharply after Labor Day; dead by October."
  confidence: moderate
  assumptions: ["That permission queries indicate felt uncertainty rather than idle curiosity."]
  operational_risks: ["Labor Day is a discount weekend; the frame excludes discount framing, so proximity is a hazard."]

- opportunity_id: OPP-02
  territory: "Keeping"
  observation: "The season's domestic instinct is preserving, and the product's core gesture is saving."
  cultural_tension: "Summer ends whether or not you were ready; the impulse is to hold onto it."
  audience_behavior: "Collecting and revisiting rather than purchasing."
  why_now: "The largest figure in the year's biggest forecast is a collection verb, and 'decluttering' ranks inside end-of-summer search."
  shopya_role: "The save IS the preserve gesture. The product's central action and the season's central instinct are the same action."
  desired_user_action: "Save into a named collection and return to it."
  instrumentation_mapping: save.created
  supporting_signal_ids: [SIG-002, SIG-011, SIG-001, SIG-014]
  contradicting_signal_ids: [SIG-015, SIG-023]
  relevant_seams: [S1, S2, S5, S6]
  surface_potential: [explore, collection_pages]
  ownability:
    level: L3-by-capability
    rationale: "Collections and price_when_saved are verified product capabilities (charter product_truth_002, 003). Transplanted to a generic commerce product the mechanism loses its function."
    dependency: "charter product_truth_001, product_truth_002, product_truth_003"
  expiration: "Evergreen with a seasonal peak. Does not expire with the weather."
  confidence: moderate
  assumptions: ["That saving reads to users as keeping rather than as a shopping-list action. The only evidence is 2018 retail-cart research."]
  operational_risks: ["The one current on-objective source is unread (SIG-015). L3-by-evidence is unclaimable this run."]

